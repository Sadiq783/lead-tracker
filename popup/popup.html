<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Tracker</title>

    <!-- Stylesheet  -->
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <div class="container">
        <header id="main-header">
            <h1 id="main-title">Track your leads</h1>
        </header>

        <main id="main-container">
            <label for="url-input" class="sr-only">Lead URL</label>
            <input type="url" id="url-input" placeholder="Enter a URL">
            <div class="button-group" aria-label="Lead actions">
                <button type="button" id="save-btn">SAVE INPUT</button>
                <button type="button" id="save-tab-btn">SAVE TAB</button>
                <button type="button" id="delete-btn">DELETE ALL</button>
            </div>
            <ul id="leads-list"></ul>
        </main>
    </div>

    <!-- JS -->
    <script src="popup.js"></script>
</body>
</html>
